name: Uni_Management_System CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Starts a MySQL database so the repository and integration tests can run
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: university_db
        ports:
          - 3306:3306
        # Wait until MySQL is ready before the tests start
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven
        run: mvn -B clean test
        env:
          # Override the defaults in application.properties so Spring connects to the MySQL service above
          DB_URL: jdbc:mysql://localhost:3306/university_db
          DB_USERNAME: root
          DB_PASSWORD: root123
