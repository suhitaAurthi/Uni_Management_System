services:
  mysql:
    image: mysql:8.4
    container_name: university-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-university_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: university-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"            # open http://localhost:8081/index.html
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-university_db}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@university.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}

volumes:
  mysql_data:
