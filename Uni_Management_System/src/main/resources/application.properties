spring.application.name=Uni_Management_System

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/university_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8081

# Initial admin credentials
app.admin.email=${ADMIN_EMAIL:admin@university.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}